name: Release extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches package version
        run: node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: npm test
      - run: npm run check
      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/hajb-${GITHUB_REF_NAME}.zip" manifest.json background.js content popup icons _locales
          unzip -t "dist/hajb-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/hajb-${GITHUB_REF_NAME}.zip" \
            --verify-tag --title "Hajb ${GITHUB_REF_NAME}" --generate-notes
