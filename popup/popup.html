<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAJB</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <div class="signal-rail" aria-hidden="true"></div>

    <header class="brand-lockup">
      <img class="brand-mark" src="../icons/brand-mark.svg" alt="">
      <div>
        <p class="brand-name" aria-label="HAJB">HAJB</p>
        <p class="brand-tagline" data-i18n="brandTagline">خطّك الزمني، بقرارك.</p>
      </div>
    </header>

    <section class="control-section" aria-labelledby="actionTypeLabel">
      <div class="section-heading">
        <span class="eyebrow" data-i18n="modeEyebrow">وضع النقرة الواحدة</span>
        <h1 id="actionTypeLabel" data-i18n="actionTypeLabel">ماذا تنفّذ النقرة؟</h1>
      </div>

      <div class="action-grid" role="radiogroup" aria-labelledby="actionTypeLabel">
        <label class="action-option action-option--block">
          <input type="radio" name="actionType" value="block">
          <span class="action-card">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8"></circle>
              <path d="m6.4 6.4 11.2 11.2"></path>
            </svg>
            <span data-i18n="blockAction">حظر</span>
          </span>
        </label>

        <label class="action-option action-option--mute">
          <input type="radio" name="actionType" value="mute">
          <span class="action-card">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
              <path d="M10 21h4M4 4l16 16"></path>
            </svg>
            <span data-i18n="muteAction">كتم</span>
          </span>
        </label>
      </div>
    </section>

    <footer class="privacy-note">
      <span class="status-dot" aria-hidden="true"></span>
      <span data-i18n="privacyNote">يعمل محليًا • بلا تتبع</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
